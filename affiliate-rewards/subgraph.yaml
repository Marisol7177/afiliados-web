specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AffiliateRewards
    network: mainnet
    source:
      address: "0x0Bf06A0B7F91f155896Aa5fdf8f38A89e38509a9"
      abi: AffiliateRewards
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - RewardPaid
      abis:
        - name: AffiliateRewards
          file: ./abis/AffiliateRewards.json
      eventHandlers:
        - event: RewardPaid(indexed address,uint256,bytes32)
          handler: handleRewardPaid
      file: ./src/affiliate-rewards.ts
