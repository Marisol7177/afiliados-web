name: Build IPFS website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipfs-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build website
        run: |
          npm ci
          npm run build
          test -s out/index.html

      - name: Create IPFS CAR
        id: ipfs
        uses: ipshipyard/ipfs-deploy-action@v3
        with:
          path-to-deploy: out
          cid-profile: unixfs-v1-2025
          github-token: ${{ github.token }}

      - name: Show CID
        env:
          CID: ${{ steps.ipfs.outputs.cid }}
          CAR_PATH: ${{ steps.ipfs.outputs.car-path }}
        run: |
          set -euo pipefail
          test -n "$CID"
          test -s "$CAR_PATH"

          {
            echo "## Sitio IPFS generado"
            echo "- CID: \`$CID\`"
            echo "- Gateway de prueba: https://dweb.link/ipfs/$CID/"
            echo "- CAR generado correctamente."
            echo "- No se ha contratado ni utilizado un servicio de pinning."
            echo "- La disponibilidad permanente en IPFS no está garantizada."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save CAR backup
        uses: actions/upload-artifact@v4
        with:
          name: ipfs-car-${{ github.sha }}
          path: ${{ steps.ipfs.outputs.car-path }}
          if-no-files-found: error
          retention-days: 30
