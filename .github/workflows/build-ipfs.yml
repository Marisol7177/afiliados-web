name: Build and publish website to IPFS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipfs-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build Next.js website
        run: |
          npm ci
          npm run build
          test -s out/index.html

      - name: Create IPFS CAR
        id: ipfs
        uses: ipshipyard/ipfs-deploy-action@v3
        with:
          path-to-deploy: out
          cid-profile: unixfs-v1-2025
          github-token: ${{ github.token }}

      - name: Upload CAR to Pinion
        env:
          PINION_UPLOAD_TOKEN: ${{ secrets.PINION_UPLOAD_TOKEN }}
          CID: ${{ steps.ipfs.outputs.cid }}
          CAR_PATH: ${{ steps.ipfs.outputs.car-path }}
        run: |
          set -euo pipefail
          test -n "$PINION_UPLOAD_TOKEN"
          test -s "$CAR_PATH"

          RESPONSE=$(mktemp)
          trap 'rm -f "$RESPONSE"' EXIT

          HTTP_CODE=$(curl -sS \
            --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 600 \
            -o "$RESPONSE" -w '%{http_code}' \
            -X POST 'https://helium.pinion.build/upload/pat/v1/?format=car&name=afiliados-web' \
            -H "Authorization: Bearer $PINION_UPLOAD_TOKEN" \
            -H 'Content-Type: application/vnd.ipld.car' \
            --data-binary "@${CAR_PATH}")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Pinion respondió HTTP $HTTP_CODE"
            cat "$RESPONSE"
            exit 1
          fi

          REMOTE_CID=$(jq -er '.pin.cid' "$RESPONSE")

          echo "CID local: $CID"
          echo "CID Pinion: $REMOTE_CID"

          if [ "$CID" != "$REMOTE_CID" ]; then
            echo "::error::El CID de Pinion no coincide con el CID local."
            cat "$RESPONSE"
            exit 1
          fi

          {
            echo "## Publicación IPFS mediante Pinion"
            echo "- CID: \`$REMOTE_CID\`"
            echo "- [Abrir web mediante gateway](https://dweb.link/ipfs/$REMOTE_CID/)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save CAR backup
        if: always() && steps.ipfs.outputs.car-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ipfs-car-${{ github.sha }}
          path: ${{ steps.ipfs.outputs.car-path }}
          if-no-files-found: warn
          retention-days: 30
